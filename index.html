<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murra salasana - Tietoturvapeli</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-box" id="gameBox">
        <img src="images/ano1.jpg" alt="Hakkeri" class="hero-img" onerror="this.style.display='none'">
        <h1>🔐 Murra salasana</h1>
        <p>Tutki kohteen some-profiili ja klikkaa sanoja oikeassa järjestyksessä murtaaksesi salasanan!</p>
        <button class="btn-start" id="startBtn">Aloita peli (60s)</button>
        <div class="leaderboard" id="startLeaderboard"></div>
    </div>

    <div class="music-control">
        <button class="music-toggle" id="musicToggle" type="button" aria-label="Mykistä taustamusiikki" aria-pressed="true">
            🔊 Musiikki päällä
        </button>
        <label class="volume-control" for="volumeSlider">
            <span>Äänenvoimakkuus</span>
            <output id="volumeValue" for="volumeSlider">20 %</output>
            <input id="volumeSlider" type="range" min="0" max="100" value="20" aria-describedby="volumeValue">
        </label>
        <span class="music-status" id="musicStatus" role="status" aria-live="polite"></span>
    </div>
    <audio id="backgroundMusic" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
